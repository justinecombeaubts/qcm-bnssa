<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM BNSSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-blue-50 min-h-screen p-4 font-['Inter']">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-blue-800">QCM BNSSA</h1>
            <div id="timer" class="text-xl font-mono bg-white p-2 rounded-lg shadow">40:00</div>
        </div>
        <div id="qcm-container" class="space-y-4">
            <!-- Les questions seront insérées ici par JavaScript -->
        </div>
        <div class="mt-6 flex justify-center">
            <button id="submit-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg transition duration-300">
                Envoyer les réponses
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
